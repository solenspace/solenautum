# Lefthook configuration — gates code quality before changes leave
# the local machine. See specs/03-git-hooks-and-commits.md for the
# rationale behind each hook.

assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: block-env-files
      run: |
        leaked=$(echo "{staged_files}" | tr ' ' '\n' | grep -E '(^|/)\.env($|\.[^.]*$)' | grep -v '\.env\.example$' || true)
        if [ -n "$leaked" ]; then
          echo "refusing to commit env files:"
          echo "$leaked"
          exit 1
        fi

    - name: biome-staged
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"

    - name: ruff-lint-staged
      root: apps/api
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
      glob: "apps/api/**/*.py"

    - name: ruff-format-staged
      root: apps/api
      run: uv run ruff format {staged_files}
      stage_fixed: true
      glob: "apps/api/**/*.py"

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm turbo run typecheck

    - name: test
      run: pnpm turbo run test

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
