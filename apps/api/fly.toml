# Fly.io app config for the Autumn FastAPI backend.
#
# Deploy from the monorepo root so the build context covers the
# `packages/sse-protocol/generated/python` workspace dependency:
#
#   fly deploy --config apps/api/fly.toml
#
# Secrets (Clerk, OpenRouter, Groq, Tavily, Langfuse, R2 credentials,
# DATABASE_URL, DATABASE_URL_UNPOOLED) are injected via `fly secrets set`
# — never check them into this file.

app = "autumn-api"
primary_region = "iad"

[build]
  # Path is relative to the working directory at `fly deploy` time, which
  # must be the monorepo root for the workspace dep to resolve.
  dockerfile = "apps/api/Dockerfile"

[env]
  LOG_FORMAT = "json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/health/ready"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
