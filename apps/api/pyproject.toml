[project]
name = "autumn-api"
version = "0.0.0"
description = "Autumn FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.4",
  "asyncpg>=0.31.0",
  "autumn-sse-protocol",
  "boto3>=1.43.3",
  "clerk-backend-api>=5.0.6",
  "crawl4ai>=0.8.6",
  "fastapi>=0.115",
  "greenlet>=3.5.0",
  "httpx>=0.28.1",
  "langfuse>=2.60.10",
  "pydantic-ai>=0.5",
  "pydantic-settings>=2.14.0",
  "scrapling>=0.2.99",
  "slowapi>=0.1.9",
  "sqlmodel>=0.0.38",
  "svix>=1.92.2",
  "uvicorn[standard]>=0.32",
]

[tool.uv]
package = true

[tool.uv.sources]
autumn-sse-protocol = { path = "../../packages/sse-protocol/generated/python", editable = true }

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "boto3-stubs[s3]>=1.43.3",
    "mypy>=1.20.2",
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "C4",    # comprehensions
  "UP",    # pyupgrade
  "N",     # pep8-naming
  "ASYNC", # async correctness
  "S",     # bandit (security)
  "ARG",   # unused arguments
  "PT",    # pytest style
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
]
ignore = [
  "E501",  # line length (formatter handles)
  "S101",  # assert used (fine in tests)
  "B008",  # function calls in defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "autumn_sse_protocol"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_reexport = true
exclude = ["build/", "dist/", "\\.venv/", "__pycache__/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Third-party deps without bundled stubs / `py.typed` markers. The strict
# `disallow_any_unimported = true` rule above would otherwise reject every
# call site that imports from these packages.
[[tool.mypy.overrides]]
module = [
  "autumn_sse_protocol",
  "autumn_sse_protocol.*",
  "crawl4ai",
  "crawl4ai.*",
  "langfuse",
  "langfuse.*",
  "scrapling",
  "scrapling.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
