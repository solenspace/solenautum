[project]
name = "autumn-api"
version = "0.0.0"
description = "Autumn FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
